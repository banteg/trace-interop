name: Verify evidence and tooling
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run trace-interop verify
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python scripts/check_schema.py
