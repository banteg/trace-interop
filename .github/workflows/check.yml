name: Verify evidence and tooling
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The same script runs locally; the spec job below builds the pinned draft separately.
      - run: scripts/check.sh
      # Advisory: a stale draft pin, an old fix catalog or an unreachable remote warns without failing CI.
      - run: uv run --locked python scripts/freshness.py
        continue-on-error: true
  specification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: echo "commit=$(jq -r .commit spec.lock.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: banteg/execution-apis
          ref: ${{ steps.pin.outputs.commit }}
          path: .spec-source
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'
          cache-dependency-path: .spec-source/tools/go.sum
      - run: make build test lint
        working-directory: .spec-source
      - run: go test ./...
        working-directory: .spec-source/tools
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .spec-source/package-lock.json
      - run: npm ci && node --test scripts/docs-spec.test.cjs && npm run build:docs:core
        working-directory: .spec-source
