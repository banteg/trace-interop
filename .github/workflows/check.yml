name: Verify evidence and tooling
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run trace-interop verify
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python scripts/check_schema.py
      - run: uv run python scripts/build_reports.py
      - run: git diff --exit-code -- reports decisions/README.md
  specification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: echo "commit=$(jq -r .commit spec.lock.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: banteg/execution-apis
          ref: ${{ steps.pin.outputs.commit }}
          path: .spec-source
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'
          cache-dependency-path: .spec-source/tools/go.sum
      - run: make build test lint
        working-directory: .spec-source
      - run: go test ./...
        working-directory: .spec-source/tools
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .spec-source/package-lock.json
      - run: npm ci && node --test scripts/docs-spec.test.cjs && npm run build:docs:core
        working-directory: .spec-source
