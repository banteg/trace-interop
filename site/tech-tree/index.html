<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trace Tech Tree</title>
<meta name="description" content="Merge order for the Ethereum trace_* standard as a game tech tree, built from the trace-interop tracker.">
<meta property="og:title" content="Trace Tech Tree">
<meta property="og:description" content="Merge order for the Ethereum trace_* standard as a game tech tree, built from the trace-interop tracker.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap">
<style>
[hidden] { display: none !important; }
/* ---------- Civilization II palette ---------- */
:root {
  color-scheme: light;
  --desk: #087c7a;
  --desk-ink: #f7f2dc;
  --gold: #f2cf63;
  --win: #c0c0c0;
  --win-hi: #ffffff;
  --win-lo: #808080;
  --win-dk: #0a0a0a;
  --ink: #17120d;
  --ink-soft: #4a4034;
  --line: #231b13;
  --hl: #b3170f;
  --paper: #efe4c6;
  --paper-2: #e2d3ab;
  --title-a: #000080;
  --title-b: #1084d0;
  --display: "Cinzel", "Trajan Pro", Georgia, serif;
  --body: "Tinos", "Times New Roman", Times, serif;
  --mono: "Tinos", "Times New Roman", serif;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--desk); color: var(--ink); font-family: var(--body); }
.page { max-width: 1760px; margin: 0 auto; padding-block: 20px 40px; padding-inline: 16px; display: grid; gap: 18px; }
canvas.spr { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px dashed var(--gold); outline-offset: 2px; }
a { color: inherit; }

/* ---------- masthead ---------- */
.masthead { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px 24px; }
.masthead h1 { margin: 0; font-family: var(--display); font-weight: 800; text-wrap: balance; line-height: 1; }
.lede { margin: 8px 0 0; max-width: 62ch; line-height: 1.45; }

.masthead h1 { font-size: clamp(30px, 5vw, 52px); color: var(--gold); letter-spacing: .04em;
  text-shadow: 2px 2px 0 #3a2a05, 4px 4px 0 rgba(0,0,0,.35); }
.lede { color: var(--desk-ink); font-size: 16px; }

/* ---------- windows ---------- */
.win { position: relative; min-width: 0; }
.titlebar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.tb-title { font-weight: 700; }
.tb-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.win-body { position: relative; }

.win { background: var(--win); padding: 3px;
  box-shadow: inset -1px -1px var(--win-dk), inset 1px 1px #dfdfdf, inset -2px -2px var(--win-lo), inset 2px 2px var(--win-hi), 6px 6px 0 rgba(0,0,0,.28); }
.titlebar { background: linear-gradient(90deg, var(--title-a), var(--title-b)); color: #fff; padding: 3px 4px 3px 8px; font-size: 14px; }
.tb-btns { display: flex; gap: 2px; }
.tb-btns i { width: 18px; height: 16px; background: var(--win); display: grid; place-items: center; color: #000; font: 700 11px/1 var(--body); font-style: normal;
  box-shadow: inset -1px -1px var(--win-dk), inset 1px 1px var(--win-hi), inset -2px -2px var(--win-lo); }
.menubar { display: flex; gap: 2px 16px; flex-wrap: wrap; padding: 4px 8px; font-size: 14px; color: #000; }
.menubar span::first-letter { text-decoration: underline; }
.inset { box-shadow: inset 1px 1px var(--win-lo), inset -1px -1px var(--win-hi), inset 2px 2px var(--win-dk), inset -2px -2px #dfdfdf; padding: 2px; }

/* ---------- toolbar ---------- */
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px 20px; flex-wrap: wrap; padding: 6px 8px; }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; align-items: center; font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 22px; height: 12px; display: inline-block; }
.fit { cursor: pointer; padding: 4px 10px; font-size: 13px; }
.toolbar { color: #000; }
.legend .k-done i { background: #8fb57a; box-shadow: inset -1px -1px #000, inset 1px 1px #fff; }
.legend .k-active i { background: #7f9cc9; outline: 2px dashed #e0c400; outline-offset: 1px; }
.legend .k-crit i { height: 4px; background: #5a1810; }
.legend .k-locked i { background: #9c9c9c; box-shadow: inset -1px -1px #000, inset 1px 1px #fff; }
.fit { background: var(--win); border: 0; box-shadow: inset -1px -1px var(--win-dk), inset 1px 1px var(--win-hi), inset -2px -2px var(--win-lo); }

/* ---------- board ---------- */
.board-wrap { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; }
.board-scale { position: relative; }
.board { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.board svg { position: absolute; inset: 0; overflow: visible; }
.board-wrap { background: #b9c0aa var(--marble, none); }

.colhead { position: absolute; top: 10px; text-align: center; white-space: nowrap; }
.colhead { font: 800 12px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--ink);
  background: var(--paper); padding: 5px 8px; box-shadow: inset -1px -1px #6d5a33, inset 1px 1px #fff8e2, 2px 2px 0 rgba(0,0,0,.25); }

.edge { fill: none; transition: opacity .15s, stroke .15s; }
.edge { stroke: var(--line); stroke-width: 2; }
.edge.locked { stroke-dasharray: 5 4; stroke: #4b4236; }
.edge.crit { stroke-width: 4; stroke: #5a1810; }
.edge.crit.locked { stroke-dasharray: 9 5; }
.arrow.crit { fill: #5a1810; }
.edge.hl { stroke: var(--hl); stroke-width: 3.2; }
.edge.crit.hl { stroke-width: 4.4; }
.arrow { fill: var(--line); }
.arrow.hl { fill: var(--hl); }
.board.has-hl .edge:not(.hl), .board.has-hl .arrow:not(.hl) { opacity: .28; }
.board.has-hl .node:not(.hl):not(.sel) { opacity: .55; }
.lane-note { font-size: 12.5px; }
.lane-note { font-family: var(--body); font-style: italic; fill: var(--ink); }

/* ---------- nodes ---------- */
.node { position: absolute; display: grid; grid-template-columns: 40px 1fr; gap: 7px; align-items: start; padding: 6px 7px 6px 6px; text-align: left; cursor: pointer; border: 0; transition: opacity .15s, transform .1s; }
.node .portrait { position: relative; width: 40px; height: 40px; display: grid; place-items: center; }
.node .nb { display: grid; gap: 3px; min-width: 0; }
.node .nt { font-weight: 700; font-size: 13px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .ns { font-size: 11px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .meter { height: 7px; position: relative; overflow: hidden; }
.node .meter i { position: absolute; inset: 0 auto 0 0; display: block; }
.node .nf { display: flex; justify-content: space-between; gap: 6px; font-size: 11px; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.node .nf .res { display: inline-flex; align-items: center; gap: 3px; }
.node .actor { position: absolute; top: -12px; right: -9px; width: 28px; height: 28px; display: grid; place-items: center; }
.node.tall { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 12px 10px; align-content: start; }
.node.tall .portrait { width: 72px; height: 72px; }
.node.tall .nt { font-size: 17px; white-space: normal; }
.node.tall .ns { white-space: normal; }
.node.tall .nd { font-size: 12px; line-height: 1.35; margin-top: 4px; }
.node.tall .nb { justify-items: center; width: 100%; }

.node { color: var(--ink); background: var(--cat);
  box-shadow: inset -1px -1px #000, inset 1px 1px rgba(255,255,255,.85), inset -2px -2px rgba(0,0,0,.35), inset 2px 2px rgba(255,255,255,.35), 3px 3px 0 rgba(0,0,0,.3); }
.node .portrait { background: var(--paper); box-shadow: inset 1px 1px #6d5a33, inset -1px -1px #fff8e2; }
.node .ns { font-style: italic; color: #2c241b; }
.node .meter { background: #f3ecd5; box-shadow: inset 1px 1px #6d5a33; }
.node .meter i { background: repeating-linear-gradient(90deg, #1d3f9e 0 5px, #3a63c9 5px 6px); }
.node .actor { background: var(--paper); box-shadow: inset -1px -1px #000, inset 1px 1px #fff, 2px 2px 0 rgba(0,0,0,.3); }
.node.st-active { outline: 3px dashed #f5dc1e; outline-offset: 1px; }
.node.now { animation: civblink 1.1s steps(2) infinite; }
.node.st-locked { background: #a3a3a3; }
.node.st-locked .portrait canvas { filter: grayscale(1) contrast(.9); opacity: .7; }
.node.st-locked .nt, .node.st-locked .ns { color: #3b3b3b; }
.node.sel { box-shadow: inset -1px -1px #000, inset 1px 1px #fff, 0 0 0 3px var(--hl), 4px 4px 0 rgba(0,0,0,.35); }
.node:hover { transform: translate(-1px,-1px); }
@keyframes civblink { 0% { outline-color: #f5dc1e; } 100% { outline-color: #1b1612; } }

/* ---------- status bars ---------- */
.statusbar { display: flex; justify-content: space-between; align-items: center; gap: 8px 18px; flex-wrap: wrap; padding: 6px 8px; font-size: 13.5px; }
.beakers { display: inline-block; height: 16px; width: 176px; position: relative; vertical-align: middle; background-repeat: repeat-x; background-size: 16px 16px; }
.beakers i { position: absolute; inset: 0 auto 0 0; background-repeat: repeat-x; background-size: 16px 16px; }
.statusbar { color: #000; }
.statusbar .cell { padding: 3px 8px; box-shadow: inset 1px 1px var(--win-lo), inset -1px -1px var(--win-hi); display: inline-flex; gap: 8px; align-items: center; }

/* ---------- lower panels ---------- */
.lower { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .lower { grid-template-columns: minmax(0, 1fr); } }
.pad { padding: 14px 16px 16px; }

.advisor { display: grid; grid-template-columns: 72px 1fr; gap: 14px; align-items: start; }
.advisor .face { width: 72px; height: 72px; display: grid; place-items: center; }
.advisor p { margin: 0; line-height: 1.45; }
.advisor .who { font-weight: 700; display: block; margin-bottom: 3px; }
ol.steps { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 9px; }
ol.steps li { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: start; }
.step-n { font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; padding-top: 1px; }
.step-h { font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.step-h .icons { display: inline-flex; gap: 3px; }
.step-p { margin: 2px 0 0; line-height: 1.4; font-size: 14px; }
.par { font-size: 11.5px; padding: 1px 6px; font-weight: 700; letter-spacing: .04em; white-space: nowrap; }

.order-win .win-body, .info-win .win-body, .council-win .win-body { background: var(--paper); color: var(--ink); }
.advisor .face { background: var(--paper-2); box-shadow: inset 1px 1px #6d5a33, inset -1px -1px #fff8e2; }
.advisor p { font-size: 15.5px; }
.advisor .who { font-family: var(--display); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
.step-n { font-family: var(--display); color: #6b1a12; font-size: 15px; }
.step-h { font-size: 15.5px; }
.par { background: #2a4e9a; color: #fff; font-family: var(--body); }
ol.steps li { padding-bottom: 9px; border-bottom: 1px solid rgba(109,90,51,.35); }
ol.steps li:last-child { border-bottom: 0; padding-bottom: 0; }

/* info panel */
.info-head { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: start; }
.info-head .big { width: 112px; height: 112px; display: grid; place-items: center; position: relative; }
.info-kicker { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
.info-head h2 { margin: 2px 0 4px; font-size: 22px; line-height: 1.1; text-wrap: balance; }
.info-sub { font-size: 13.5px; }
.chip { display: inline-block; font-size: 12px; padding: 2px 8px; margin-top: 8px; font-weight: 700; }
.info-desc { margin: 12px 0 0; line-height: 1.5; font-size: 15px; max-width: 62ch; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 12px; }
.stat { padding: 6px 9px; }
.stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; }
.rel { margin-top: 12px; display: grid; gap: 6px; }
.rel-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
.rel-row > span:first-child { min-width: 64px; font-weight: 700; }
.rel button { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 3px; cursor: pointer; font-size: 13px; }
.links { margin-top: 12px; font-size: 13.5px; display: flex; gap: 6px 14px; flex-wrap: wrap; }

.info-kicker { font-family: var(--display); color: #6b1a12; }
.info-head h2 { font-family: var(--display); font-weight: 800; }
.info-sub { font-style: italic; }
.info-head .big { background: var(--paper-2); box-shadow: inset 2px 2px #6d5a33, inset -2px -2px #fff8e2; }
.chip { background: #1b1612; color: var(--paper); }
.chip.st-active { background: #2a4e9a; color: #fff; }
.chip.st-locked { background: #7a7a7a; color: #fff; }
.stat { background: var(--paper-2); box-shadow: inset 1px 1px #6d5a33, inset -1px -1px #fff8e2; }
.rel button { background: var(--win); border: 0; box-shadow: inset -1px -1px var(--win-dk), inset 1px 1px var(--win-hi), inset -2px -2px var(--win-lo); color: #000; }
.links a { color: #1d2f9e; }

/* council */
.council { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.actor-card { display: grid; grid-template-columns: 60px 1fr; gap: 10px; align-items: start; padding: 8px; }
.actor-card .face { width: 60px; height: 60px; display: grid; place-items: center; position: relative; }
.actor-card b { display: block; font-size: 15px; }
.actor-card em { display: block; font-size: 12.5px; margin: 1px 0 3px; }
.actor-card p { margin: 0; font-size: 13.5px; line-height: 1.4; }
.repos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.roster { margin-top: 8px; display: grid; gap: 4px; font-size: 13.5px; line-height: 1.45; max-width: 90ch; }
.roster p { margin: 0; }
.roster b { font-family: var(--display); font-weight: 800; font-size: 12.5px; letter-spacing: .04em; color: #6b1a12; }
.repo { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 3px; font-size: 13px; text-decoration: none; }

.actor-card { background: var(--paper-2); box-shadow: inset 1px 1px #fff8e2, inset -1px -1px #6d5a33; }
.actor-card .face { background: var(--paper); box-shadow: inset 1px 1px #6d5a33, inset -1px -1px #fff8e2; }
.actor-card b { font-family: var(--display); font-weight: 800; font-size: 14px; letter-spacing: .03em; }
.actor-card em { color: #6b1a12; }
.repo { background: var(--win); color: #000; box-shadow: inset -1px -1px var(--win-dk), inset 1px 1px var(--win-hi), inset -2px -2px var(--win-lo); }
.section-label { font-family: var(--display); font-weight: 800; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #6b1a12; margin: 16px 0 0; }

.foot { font-size: 13px; line-height: 1.5; max-width: 90ch; }
.foot { color: var(--desk-ink); }

@media (max-width: 560px) {
  .info-head { grid-template-columns: 80px 1fr; }
  .info-head .big { width: 80px; height: 80px; }
  .advisor { grid-template-columns: 56px 1fr; }
  .advisor .face { width: 56px; height: 56px; }
  ol.steps li { grid-template-columns: 28px 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <div>
      <h1>Trace Tech Tree</h1>
      <p class="lede" id="lede"></p>
    </div>
  </header>

  <section class="win" aria-labelledby="tree-title">
    <div class="titlebar">
      <span class="tb-title" id="tree-title"></span>
      <span class="tb-right">
        <span class="tb-btns" aria-hidden="true"><i>_</i><i>□</i><i>×</i></span>
      </span>
    </div>
    <div class="menubar" aria-hidden="true"><span>Game</span><span>Kingdom</span><span>View</span><span>Orders</span><span>Advisors</span><span>World</span><span>Civilopedia</span></div>
    <div class="toolbar">
      <div class="legend" id="legend"></div>
      <button type="button" class="fit" id="fit"></button>
    </div>
    <div class="inset">
      <div class="board-wrap" id="board-wrap">
        <div class="board-scale" id="board-scale">
          <div class="board" id="board"></div>
        </div>
      </div>
    </div>
    <div class="statusbar" id="statusbar"></div>
  </section>

  <div class="lower">
    <section class="win order-win" aria-labelledby="order-title">
      <div class="titlebar"><span class="tb-title" id="order-title"></span><span class="tb-btns" aria-hidden="true"><i>×</i></span></div>
      <div class="win-body pad" id="order"></div>
    </section>
    <section class="win info-win" aria-labelledby="info-title">
      <div class="titlebar"><span class="tb-title" id="info-title"></span><span class="tb-btns" aria-hidden="true"><i>×</i></span></div>
      <div class="win-body pad" id="info" aria-live="polite"></div>
    </section>
  </div>

  <section class="win council-win" aria-labelledby="council-title">
    <div class="titlebar"><span class="tb-title" id="council-title"></span><span class="tb-btns" aria-hidden="true"><i>×</i></span></div>
    <div class="win-body pad">
      <div class="council" id="council"></div>
      <p class="section-label" id="repos-label"></p>
      <div class="repos" id="repos"></div>
      <p class="section-label" id="roster-label"></p>
      <div class="roster" id="roster"></div>
    </div>
  </section>

  <p class="foot" id="foot"></p>
</div>

<script id="tree-data" type="application/json">{{TREE_DATA}}</script>

const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const lum = h => { const [r, g, b] = hex2rgb(h); return (0.3 * r + 0.59 * g + 0.11 * b) / 255; };

function pix(ch, mode) {
  const c = PAL[ch];
  if (mode === 'grey') { const v = Math.round(90 + lum(c) * 110); return `rgb(${v},${v},${v})`; }
  return c;
}
function sprite(name, size, mode, badge) {
  const c = document.createElement('canvas');
  c.width = c.height = 16;
  const x = c.getContext('2d');
  const paint = (rows, ox, oy) => rows.forEach((row, j) => [...row].forEach((ch, i) => {
    if (ch === '.') return;
    x.fillStyle = pix(ch, mode);
    x.fillRect(ox + i, oy + j, 1, 1);
  }));
  paint(SPR[name], 0, 0);
  if (badge) paint(STAR, 10, 10);
  c.className = 'spr';
  c.style.width = c.style.height = size + 'px';
  c.setAttribute('aria-hidden', 'true');
  return c;
}

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function marble() {
  const W = 192, N = 8, rand = rng(7), grid = Array.from({ length: 32 * 32 }, rand);
  const c = document.createElement('canvas'); c.width = c.height = W;
  const ctx = c.getContext('2d'), img = ctx.createImageData(W, W);
  const sm = t => t * t * (3 - 2 * t);
  const noise = (x, y, n) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = sm(x - xi), yf = sm(y - yi);
    const v = (i, j) => grid[((j % n + n) % n) * n + ((i % n + n) % n)];
    const a = v(xi, yi), b = v(xi + 1, yi), c2 = v(xi, yi + 1), d = v(xi + 1, yi + 1);
    return a + (b - a) * xf + (c2 - a) * yf + (a - b - c2 + d) * xf * yf;
  };
  for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
    let t = 0;
    for (let o = 1; o <= 4; o *= 2) t += noise(x / W * N * o, y / W * N * o, N * o) / o;
    const v = Math.abs(Math.sin(2 * Math.PI * (x / W + 2 * y / W) + t * 5.5));
    const k = Math.pow(v, 0.35);
    const i = (y * W + x) * 4;
    img.data[i] = 146 + k * 52; img.data[i + 1] = 156 + k * 50; img.data[i + 2] = 132 + k * 44; img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return c.toDataURL();
}

  return c.toDataURL();

const G = { nodeW: 172, nodeH: 68, rowH: 92, top: 58, left: 16 };
G.cols = Math.max(...NODES.map(n => n.col)) + 1;
G.rows = Math.max(...NODES.map(n => n.row + n.span));
G.colX = DATA.layout.gutters.slice(0, G.cols - 1).reduce((xs, g) => [...xs, xs[xs.length - 1] + G.nodeW + g], [G.left]);
const BW = G.colX[G.cols - 1] + G.nodeW + G.left;
const BH = G.top + (G.rows - 1) * G.rowH + G.nodeH + 16;
const gutterAfter = col => G.colX[col + 1] - G.colX[col] - G.nodeW;
const occupied = new Set(NODES.flatMap(n => Array.from({ length: n.span }, (_, i) => `${n.col},${n.row + i}`)));
function geo(n) {
  return { x: G.colX[n.col], y: G.top + n.row * G.rowH, w: G.nodeW, h: G.nodeH + (n.span - 1) * G.rowH };
}
// a same-row edge that would run under a node between its ends
function blocked(a, b) {
  for (let c = a.col + 1; c < b.col; c++) if (occupied.has(`${c},${a.row}`)) return true;
  return false;
}

let selected = DATA.researching || NODES[0].id;
let fitMode = null;

function edgesFor() {
  const es = [];
  NODES.forEach(n => n.requires.forEach(r => {
    const a = byId[r];
    let kind = 'side';
    if (a.col === n.col) kind = 'vert';
    else if (a.row === n.row && blocked(a, n)) kind = 'under';
    es.push({ from: r, to: n.id, kind, crit: a.critical && n.critical });
  }));
  // spread anchors so parallel edges stay distinct
  const outs = {}, ins = {};
  es.filter(e => e.kind === 'side').forEach(e => {
    (outs[e.from] ??= []).push(e);
    (ins[e.to] ??= []).push(e);
  });
  const cy = id => { const g = geo(byId[id]); return g.y + g.h / 2; };
  const spread = (g, i, n, max) => n === 1 ? g.y + g.h / 2 : g.y + g.h / 2 + (i - (n - 1) / 2) * Math.min(max, (g.h - 22) / (n - 1));
  Object.entries(outs).forEach(([id, list]) => {
    list.sort((p, q) => cy(p.to) - cy(q.to) || byId[p.to].col - byId[q.to].col);
    list.forEach((e, i) => e.y1 = spread(geo(byId[id]), i, list.length, 9));
  });
  Object.entries(ins).forEach(([id, list]) => {
    list.sort((p, q) => cy(p.from) - cy(q.from));
    const g = geo(byId[id]);
    list.forEach((e, i) => e.y2 = spread(g, i, list.length, g.h > 100 ? 26 : 9));
  });
  return es;
}

function pathFor(e) {
  const a = geo(byId[e.from]), b = geo(byId[e.to]);
  if (e.kind === 'vert') {
    const x = a.x + a.w / 2;
    return a.y < b.y
      ? { d: `M${x},${a.y + a.h} V${b.y - 2}`, end: [x, b.y], dir: 'down' }
      : { d: `M${x},${a.y} V${b.y + b.h + 2}`, end: [x, b.y + b.h], dir: 'up' };
  }
  if (e.kind === 'under') {
    // dips below the row to skip the nodes in between
    const x1 = a.x + a.w / 2 + 34, x2 = b.x + b.w / 2 - 34, y1 = a.y + a.h, low = y1 + 13;
    const d = `M${x1},${y1} C${x1},${low + 8} ${x2},${low + 8} ${x2},${y1 + 2}`;
    return { d, end: [x2, y1], dir: 'up' };
  }
  const x1 = a.x + a.w, x2 = b.x, y2 = e.y2;
  const y1 = Math.abs(e.y1 - y2) < 6 ? y2 : e.y1;
  let d;
  if (y1 === y2) d = `M${x1},${y1} H${x2 - 2}`;
  else if (byId[e.to].col - byId[e.from].col > 1) {
    // skip a column through the gutter, so the line never runs under a node
    const gx = x1 + gutterAfter(byId[e.from].col) / 2, r = 6, s = Math.sign(y2 - y1);
    d = `M${x1},${y1} H${gx - r} Q${gx},${y1} ${gx},${y1 + s * r} V${y2 - s * r} Q${gx},${y2} ${gx + r},${y2} H${x2 - 2}`;
  }
  else { const dx = Math.max(30, (x2 - x1) * 0.5); d = `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2 - 2},${y2}`; }
  return { d, end: [x2, y2], dir: 'right' };
}

function arrow([x, y], dir) {
  const s = 6;
  if (dir === 'right') return `${x},${y} ${x - s},${y - s * .7} ${x - s},${y + s * .7}`;
  if (dir === 'down') return `${x},${y} ${x - s * .7},${y - s} ${x + s * .7},${y - s}`;
  return `${x},${y} ${x - s * .7},${y + s} ${x + s * .7},${y + s}`;
}

function ancestors(id, acc = new Set()) {
  acc.add(id);
  byId[id].requires.forEach(r => ancestors(r, acc));
  return acc;
}

/* ================= render ================= */
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const SVGNS = 'http://www.w3.org/2000/svg';
const badged = n => n.category === 'stable';

function renderBoard() {
  const S = UI;
  const board = $('board');
  board.innerHTML = '';
  board.style.width = BW + 'px';
  board.style.height = BH + 'px';

  DATA.eras.forEach(era => {
    const [c0, c1] = era.cols;
    const c = el('div', 'colhead', era.text);
    c.style.left = G.colX[c0] + 'px';
    c.style.width = (G.colX[c1] + G.nodeW - G.colX[c0]) + 'px';
    board.append(c);
  });

  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('width', BW); svg.setAttribute('height', BH);
  svg.setAttribute('aria-hidden', 'true');
  const g = document.createElementNS(SVGNS, 'g'); g.setAttribute('class', 'edges');
  edgesFor().forEach(e => {
    const { d, end, dir } = pathFor(e);
    const cls = (byId[e.to].status === 'locked' ? ' locked' : '') + (e.crit ? ' crit' : '');
    const p = document.createElementNS(SVGNS, 'path');
    p.setAttribute('d', d);
    p.setAttribute('class', 'edge' + cls);
    p.dataset.from = e.from; p.dataset.to = e.to;
    const a = document.createElementNS(SVGNS, 'polygon');
    a.setAttribute('points', arrow(end, dir));
    a.setAttribute('class', 'arrow' + cls);
    a.dataset.from = e.from; a.dataset.to = e.to;
    g.append(p, a);
  });
  svg.append(g);
  const lane = DATA.layout.lane_note;
  const note = document.createElementNS(SVGNS, 'text');
  note.setAttribute('class', 'lane-note');
  note.setAttribute('x', (G.colX[lane.cols[0]] + G.colX[lane.cols[1]] + G.nodeW) / 2);
  note.setAttribute('y', G.top + lane.row * G.rowH - 9);
  note.setAttribute('text-anchor', 'middle');
  note.textContent = lane.text;
  svg.append(note);
  board.append(svg);

  NODES.forEach(n => {
    const gm = geo(n), tall = n.span > 1, pr = n.progress;
    const b = el('button', `node st-${n.status}${tall ? ' tall' : ''}${n.now ? ' now' : ''}`);
    b.type = 'button';
    b.dataset.id = n.id;
    b.style.left = gm.x + 'px'; b.style.top = gm.y + 'px';
    b.style.width = gm.w + 'px'; b.style.height = gm.h + 'px';
    b.style.setProperty('--cat', CAT_COLORS[n.category]);
    b.setAttribute('aria-label', `${n.title}, ${S.st[n.status]}${pr ? `, ${pr[0]} of ${pr[1]}` : ''}`);
    const port = el('span', 'portrait');
    port.append(spr(n.icon, tall ? 64 : 32, badged(n)));
    const body = el('span', 'nb');
    body.append(el('span', 'nt', n.title), el('span', 'ns', n.sub));
    if (pr) {
      const m = el('span', 'meter'); const fill = el('i');
      fill.style.width = (100 * pr[0] / pr[1]) + '%';
      m.append(fill); body.append(m);
    }
    if (tall) body.append(el('span', 'nd', n.tag));
    else {
      const foot = el('span', 'nf');
      const left = el('span');
      if (n.prs && (n.prs.merged || n.prs.open)) left.append(resChip(n.prs));
      else left.textContent = n.label || (badged(n) ? S.cat.stable : '');
      foot.append(left, el('span', null, pr ? `${pr[0]}/${pr[1]}` : ''));
      body.append(foot);
    }
    b.append(port, body);
    if (n.actor) {
      const ac = el('span', 'actor');
      ac.title = actorById[n.actor].name;
      ac.append(spr(actorById[n.actor].icon, 22));
      b.append(ac);
    }
    b.addEventListener('mouseenter', () => highlight(n.id));
    b.addEventListener('mouseleave', () => highlight(null));
    b.addEventListener('focus', () => highlight(n.id));
    b.addEventListener('blur', () => highlight(null));
    b.addEventListener('click', () => select(n.id, false));
    board.append(b);
  });
  highlight(null);
  applyFit();
}

function resChip({ merged, open }) {
  const s = el('span', 'res');
  s.textContent = `✓${merged}  ○${open}`;
  return s;
}

function highlight(id) {
  const board = $('board');
  const set = id ? ancestors(id) : null;
  board.classList.toggle('has-hl', !!set);
  board.querySelectorAll('.node').forEach(n => {
    n.classList.toggle('hl', !!set && set.has(n.dataset.id));
    n.classList.toggle('sel', n.dataset.id === selected);
  });
  board.querySelectorAll('.edge, .arrow').forEach(p => p.classList.toggle('hl', !!set && set.has(p.dataset.from) && set.has(p.dataset.to)));
}

function select(id, quiet) {
  selected = id;
  highlight(id);
  renderInfo();
  if (!quiet && window.matchMedia('(max-width: 860px)').matches) $('info').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function renderInfo() {
  const S = UI, n = byId[selected], box = $('info');
  box.innerHTML = '';
  const head = el('div', 'info-head');
  const big = el('div', 'big'); big.append(spr(n.icon, 96, badged(n)));
  const txt = el('div');
  txt.append(el('div', 'info-kicker', S.cat[n.category]), el('h2', null, n.title), el('div', 'info-sub', n.sub));
  txt.append(el('span', `chip st-${n.status}`, n.status === 'locked' ? `${S.st.locked}: ${n.label.replace(/^waits on /, '')}` : S.st[n.status]));
  head.append(big, txt);
  box.append(head, el('p', 'info-desc', n.summary ? `${n.text} ${n.summary}` : n.text));

  const stats = el('div', 'stats');
  const stat = (v, l) => { const s = el('div', 'stat'); s.append(el('b', null, v), el('span', null, l)); stats.append(s); };
  if (n.progress) stat(`${n.progress[0]}/${n.progress[1]}`, n.progress[2]);
  if (n.prs) { stat(String(n.prs.merged), 'PRs merged'); stat(String(n.prs.open), 'PRs open'); }
  if (stats.children.length) box.append(stats);

  const rel = el('div', 'rel');
  const row = (label, ids) => {
    if (!ids.length) return;
    const r = el('div', 'rel-row'); r.append(el('span', null, label));
    ids.forEach(i => {
      const b = el('button'); b.type = 'button';
      b.append(spr(byId[i].icon, 18, badged(byId[i])), document.createTextNode(byId[i].title));
      b.addEventListener('click', () => select(i, true));
      r.append(b);
    });
    rel.append(r);
  };
  row('Requires', n.requires);
  row(S.allows, n.allows);
  if (rel.children.length) box.append(rel);

  const links = el('div', 'links');
  const a = el('a', null, n.url.replace('https://github.com/', 'github.com/'));
  a.href = n.url; a.target = '_blank'; a.rel = 'noopener';
  links.append(a);
  if (n.actor) links.append(el('span', null, `${S.unit}: ${actorById[n.actor].name}${n.also ? `, with ${n.also}` : ''}`));
  box.append(links);
}

function renderOrder() {
  const S = UI, box = $('order');
  box.innerHTML = '';
  const adv = el('div', 'advisor');
  const face = el('div', 'face'); face.append(spr('sage', 64));
  const p = el('p'); p.append(el('span', 'who', S.advisor), document.createTextNode(DATA.advisor.text));
  adv.append(face, p);
  box.append(adv);
  const ol = el('ol', 'steps');
  const roman = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
  DATA.steps.forEach((s, i) => {
    const li = el('li');
    li.append(el('span', 'step-n', roman[i] + '.'));
    const body = el('div');
    const h = el('div', 'step-h');
    const icons = el('span', 'icons');
    s.nodes.forEach(id => icons.append(spr(byId[id].icon, 22, badged(byId[id]))));
    h.append(icons, el('span', null, s.title));
    if (s.parallel) h.append(el('span', 'par', s.parallel));
    body.append(h, el('p', 'step-p', s.text));
    li.append(body);
    ol.append(li);
  });
  box.append(ol);
}

function renderCouncil() {
  const S = UI, box = $('council');
  box.innerHTML = '';
  DATA.actors.filter(a => a.council !== false).forEach(a => {
    const c = el('div', 'actor-card');
    const f = el('div', 'face'); f.append(spr(a.icon, 48));
    const t = el('div');
    t.append(el('b', null, a.name), el('em', null, a.role), el('p', null, a.note));
    c.append(f, t);
    box.append(c);
  });
  const repos = $('repos'); repos.innerHTML = '';
  DATA.repos.forEach(({ icon, name, url }) => {
    const a = el('a', 'repo'); a.href = url; a.target = '_blank'; a.rel = 'noopener';
    a.append(spr(icon, 22), document.createTextNode(name));
    repos.append(a);
  });
  $('repos-label').textContent = S.repos;
  $('roster-label').textContent = S.roster;
  const roster = $('roster'); roster.innerHTML = '';
  DATA.contributors.forEach(({ project, names }) => {
    const row = el('p'); row.append(el('b', null, project), document.createTextNode(` ${names.join(', ')}`));
    roster.append(row);
  });
}

function renderChrome() {
  const S = UI, T = DATA.totals;
  $('lede').textContent = S.lede;
  $('tree-title').textContent = S.tree;
  $('order-title').textContent = S.order;
  $('info-title').textContent = S.info;
  $('council-title').textContent = S.council;

  const lg = $('legend'); lg.innerHTML = '';
  ['done', 'active', 'locked'].forEach(k => { const s = el('span', 'k-' + k); s.append(el('i'), document.createTextNode(S.legend[k])); lg.append(s); });
  const crit = el('span', 'k-crit'); crit.append(el('i'), document.createTextNode(S.crit)); lg.append(crit);
  const prs = el('span');
  prs.textContent = '✓ merged PRs · ○ open PRs';
  lg.append(prs);

  const researching = DATA.researching ? byId[DATA.researching].title : null;
  const captured = fmtDate(DATA.captured);
  const sb = $('statusbar'); sb.innerHTML = '';
  const c1 = el('span', 'cell');
  const bk = el('span', 'beakers'); bk.style.backgroundImage = `url(${beakerURL('grey')})`;
  const fill = el('i'); fill.style.backgroundImage = `url(${beakerURL('civ')})`; fill.style.width = (176 * T.agree / T.of) + 'px';
  bk.append(fill);
  c1.append(document.createTextNode(`${researching ? `Researching: ${researching}` : 'Research complete'} · ${T.agree}/${T.of} decisions agree`), bk);
  sb.append(c1, el('span', 'cell', `${T.merged} PRs merged · ${T.open} open`), el('span', 'cell', `${captured} A.D.`));

  const foot = $('foot'); foot.innerHTML = '';
  const commit = el('a', null, DATA.commit);
  commit.href = `https://github.com/banteg/trace-interop/commit/${DATA.commit}`;
  foot.append(document.createTextNode('Built from trace-interop '), commit,
    document.createTextNode(`, with the matrix captured ${captured} and PR states checked ${fmtDate(DATA.fixes_checked)}. `
      + `Totals count the ${T.clients.join(', ')} dev builds, with library PRs included. Click any node for details; hover to trace its prerequisites.`));
}

function applyFit() {
  const wrap = $('board-wrap'), scale = $('board-scale'), board = $('board');
  const s = Math.min(1, wrap.clientWidth / BW);
  if (fitMode === null) fitMode = s >= 0.8;
  const k = fitMode ? s : 1;
  board.style.transform = k < 1 ? `scale(${k})` : '';
  scale.style.width = (BW * k) + 'px';
  scale.style.height = (BH * k) + 'px';
  $('fit').textContent = UI.fit[fitMode ? 0 : 1];
  $('fit').hidden = s >= 1;
}

function renderAll() {
  renderChrome();
  renderBoard();
  renderOrder();
  renderInfo();
  renderCouncil();
}

document.documentElement.style.setProperty('--marble', `url(${marble()})`);
$('fit').addEventListener('click', () => { fitMode = !fitMode; applyFit(); });
window.addEventListener('resize', applyFit);
renderAll();
</script>
</body>
</html>
