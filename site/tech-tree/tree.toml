# Layout and wording of the trace_* tech tree. scripts/build_tech_tree.py adds every number and
# state at build time from the tracker: reports/progress.json (client builds), decisions/fixes.json
# (PR states) and decisions/status.json (policy), so text here should stay true as those change.
#
# A node takes its state from one binding:
#   client + build   a client build in progress.json; done once it agrees on every settled decision
#   repos            library PRs in fixes.json; done once none is open
#   pr               one PR in fixes.json; done once merged
#   done_with        done once that node is done
#   status           a fixed state (default: active)
# locked_until keeps a node locked until those nodes are done. `sub` may use {version}.
# cell is [column, row]; span is a height in rows. Critical nodes form the highlighted path.

[layout]
# gap after each column; wide where edges fan in or out
gutters = [46, 46, 46, 34, 34, 34, 46]
lane_note = { cols = [3, 6], row = 1, text = "Releases ship the dev fixes on each client’s own schedule →" }

[[era]]
cols = [0, 1]
text = "I · Foundations & libraries"

[[era]]
cols = [2, 2]
text = "II · Dev builds"

[[era]]
cols = [3, 3]
text = "III · Council"

[[era]]
cols = [4, 4]
text = "IV · Geth"

[[era]]
cols = [5, 5]
text = "V · Fixtures"

[[era]]
cols = [6, 6]
text = "VI · Spec & releases"

[[era]]
cols = [7, 7]
text = "VII · Wonder"

[advisor]
text = "Sire, the clients can all research at once. The Geth namespace is our bottleneck: fixtures, the spec and Hive all wait on it. Releases arrive on their own."

# ---------- foundations ----------

[[node]]
id = "harness"
title = "trace-interop"
sub = "Hive matrix · evidence"
icon = "telescope"
cell = [0, 3]
category = "foundation"
actor = "banteg"
status = "done"
label = "Running"
url = "https://github.com/banteg/trace-interop"
text = "Frozen chains, request corpora and per-client reports. Hive runs them on the stable and dev build of every client, so each fix is verified on a real build."

[[node]]
id = "spec"
title = "Spec draft"
sub = "execution-apis #895"
icon = "scroll"
cell = [1, 3]
category = "foundation"
requires = ["harness"]
status = "done"
label = "Posted"
url = "https://github.com/ethereum/execution-apis/pull/895"
text = "The opinionated draft for all nine trace_* methods and the trace, stateDiff and vmTrace outputs. Kept as one PR so clients react to concrete rules instead of a poll."

