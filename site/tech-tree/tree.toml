# ---------- critical path ----------

[[node]]
id = "consensus"
title = "Rough consensus"
sub = "named reviews on #895"
icon = "scales"
cell = [3, 3]
category = "council"
critical = true
requires = ["spec", "reth", "erigon", "nethermind", "besu"]
actor = "wg"
pr = "https://github.com/ethereum/execution-apis/pull/895"
progress = "converged"
url = "https://github.com/ethereum/execution-apis/issues/890"
text = "execution-apis needs named reviews from client developers on #895. A vote count or silence doesn’t establish acceptance. This needs dev builds that agree, not releases."

[[node]]
id = "geth"
title = "Geth namespace"
sub = "go-ethereum #35791"
icon = "crown"
cell = [4, 3]
category = "geth"
critical = true
requires = ["consensus"]
actor = "lightclient"
pr = "https://github.com/ethereum/go-ethereum/pull/35791"
url = "https://github.com/ethereum/go-ethereum/pull/35791"
text = "The normal execution-apis path needs the methods in upstream Geth. The draft fork implements all nine and agrees on every assessed check. lightclient gave a preliminary go-ahead."

[[node]]
id = "fixtures"
title = "Test fixtures"
sub = "rpctestgen · from Geth"
icon = "press"
cell = [5, 3]
category = "tests"
critical = true
requires = ["geth"]
done_with = "specmerge"
locked_until = ["geth"]
label = "generating"
url = "https://github.com/lightclient/rpctestgen"
text = "execution-apis generates its test fixtures by running rpctestgen against Geth on the repository’s own chain. The fallback is an explicit CI exception from the editors."

[[node]]
id = "specmerge"
title = "Spec merged"
sub = "execution-apis #895"
icon = "tablet"
cell = [6, 3]
category = "spec"
critical = true
requires = ["fixtures", "consensus"]
actor = "chase"
pr = "https://github.com/ethereum/execution-apis/pull/895"
locked_until = ["fixtures"]
url = "https://github.com/ethereum/execution-apis/pull/895"
text = "Schemas, speccheck, generated fixtures and client reviews land together. Once merged, the spec is canonical and its fixtures are what Hive runs."

[[node]]
id = "hive"
title = "Hive rpc-compat"
sub = "ethereum/hive"
icon = "hive"
cell = [7, 2]
span = 3
category = "wonder"
critical = true
requires = ["specmerge", "reth-st", "erigon-st", "nethermind-st", "besu-st"]
actor = "consumers"
status = "active"
locked_until = ["specmerge"]
url = "https://github.com/ethereum/hive"
tag = "Fixtures replayed against every client. Stable releases must pass."
text = "Hive’s rpc-compat simulator replays the execution-apis fixtures against client images, so stable releases have to pass. Consumers can then drop their per-client workarounds."

