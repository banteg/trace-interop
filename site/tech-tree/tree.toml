# ---------- merge order ----------

[[step]]
nodes = ["reth", "erigon", "nethermind", "besu", "anvil"]
parallel = "all at once"
title = "Dev fixes in every client"
text = "Reth goes through revm → revm-inspectors and Alloy releases, then a bump. Erigon lands rpc-tests fixtures first. Nethermind and Besu take PRs directly. Anvil runs alongside for tooling."

[[step]]
nodes = ["consensus"]
parallel = "overlaps 1"
title = "Rough consensus on #895"
text = "Named client reviews of the converged rules. Needs dev builds that agree, not releases."

[[step]]
nodes = ["geth"]
title = "Geth trace namespace upstream"
text = "Merge go-ethereum #35791. This is the bottleneck: fixtures, the spec and Hive all wait on it."

[[step]]
nodes = ["fixtures"]
title = "Generate fixtures from Geth"
text = "Run rpctestgen on the execution-apis chain. The fallback is an explicit CI exception from the editors."

[[step]]
nodes = ["specmerge"]
title = "Merge execution-apis #895"
text = "Spec, speccheck, fixtures and reviews in one PR. The trace namespace becomes canonical."

[[step]]
nodes = ["reth-st", "erigon-st", "nethermind-st", "besu-st"]
parallel = "alongside 3–5"
title = "Stable releases catch up"
text = "Each client ships its dev fixes on its own schedule. Nothing to merge here, just releases to wait for."

[[step]]
nodes = ["hive"]
title = "Hive rpc-compat green"
text = "Hive runs the new fixtures against stable images. Anvil stays outside since it has no Engine API."
